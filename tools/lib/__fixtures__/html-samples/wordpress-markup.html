<!DOCTYPE html>
<html lang="en-GB" class="no-js">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My WordPress Site</title>
  <link rel="stylesheet" href="https://example.com/wp-content/themes/mytheme/style.css" />
  <link rel="stylesheet" href="https://example.com/wp-content/plugins/woocommerce/assets/css/woocommerce.css" />
</head>
<body class="home page-template-default page page-id-1 wp-custom-logo">
  <div id="wpadminbar" class="nojsfix">
    <div class="quicklinks">
      <a href="/wp-admin">Dashboard</a>
    </div>
  </div>
  <header id="masthead" class="site-header" data-sticky-header="true">
    <div class="site-branding">
      <img src="/wp-content/uploads/2026/01/logo.png" class="custom-logo" alt="Site Logo" />
      <h1 class="site-title"><a href="/">My WordPress Site</a></h1>
    </div>
    <nav id="site-navigation" class="main-navigation" aria-label="Primary">
      <ul id="primary-menu" class="menu">
        <li class="menu-item menu-item-type-post_type">
          <a href="/about">About</a>
        </li>
        <li class="menu-item menu-item-type-post_type current-menu-item">
          <a href="/services">Services</a>
        </li>
      </ul>
    </nav>
  </header>
  <div id="page" class="site">
    <div id="content" class="site-content">
      <main id="main" class="site-main" role="main">
        <article id="post-1" class="post-1 page type-page status-publish hentry">
          <div class="entry-content">
            <div class="wp-block-group has-global-padding is-layout-constrained">
              <h1 class="wp-block-heading">Welcome to Our Site</h1>
              <p class="has-medium-font-size">We provide excellent services to our customers.</p>
              <a href="/contact" class="wp-block-button__link wp-element-button">Contact Us</a>
            </div>
          </div>
        </article>
      </main>
    </div>
  </div>
  <footer id="colophon" class="site-footer">
    <div class="site-info">
      <a href="https://wordpress.org">Proudly powered by WordPress</a>
    </div>
  </footer>
  <script src="/wp-includes/js/jquery/jquery.min.js" id="jquery-core-js"></script>
  <script src="/wp-content/plugins/woocommerce/assets/js/frontend/woocommerce.min.js" data-wc-version="8.0.0"></script>
</body>
</html>
