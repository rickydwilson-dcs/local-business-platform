<!DOCTYPE html>
<html lang="en" data-squarespace-page="home">
<head>
  <meta charset="UTF-8" />
  <title>Squarespace Site</title>
  <link rel="stylesheet" href="/assets/main.css" />
</head>
<body id="body" class="tweak-transparent-header collection-type-page" data-controller="HeaderController">
  <div id="header" data-section-theme="black" data-content-field="site-title">
    <div class="header-inner">
      <div class="header-branding">
        <a href="/" class="header-title-link">My Squarespace Site</a>
      </div>
      <nav class="header-nav">
        <div class="header-nav-item">
          <a class="header-nav-folder-title" href="/about">About</a>
        </div>
        <div class="header-nav-item">
          <a class="header-nav-folder-title" href="/work">Work</a>
        </div>
      </nav>
    </div>
  </div>
  <main id="page">
    <article data-page-sections id="sections">
      <section data-section-id="60a1b2c3" class="page-section sqs-section" data-section-theme="white">
        <div class="content-wrapper" data-content-field="main-content">
          <div class="sqs-block html-block" data-block-type="2">
            <div class="sqs-block-content">
              <h1 data-rte-preserve-empty="true" class="sqsrte-large">Exceptional Creative Work</h1>
              <p>We craft digital experiences that captivate and convert.</p>
              <a href="/contact" class="sqs-block-button-element sqs-button-element--primary">Start a Project</a>
            </div>
          </div>
        </div>
      </section>
      <section data-section-id="60a1b2c4" class="page-section sqs-section" data-section-theme="black">
        <div class="content-wrapper">
          <div class="sqs-gallery-container">
            <div class="sqs-gallery sqs-gallery-block-grid" data-layout-mode="grid">
              <div class="sqs-gallery-design-grid-slide">
                <img src="/static/images/project1.jpg" alt="Project 1" data-image-dimensions="1200x800" />
              </div>
              <div class="sqs-gallery-design-grid-slide">
                <img src="/static/images/project2.jpg" alt="Project 2" data-image-dimensions="1200x800" />
              </div>
            </div>
          </div>
        </div>
      </section>
    </article>
  </main>
  <footer id="footer" class="sections">
    <section class="page-section" data-section-id="footer-section">
      <div class="content-wrapper">
        <p class="sqsrte-small">© 2026 My Site. All Rights Reserved.</p>
      </div>
    </section>
  </footer>
  <script src="/universal/scripts-compressed/site-bundle.js"></script>
</body>
</html>
