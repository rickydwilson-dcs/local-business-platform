<!doctype html><html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>DCS round 8 — four worlds</title>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#F3F3F1;--ink:#14161C;--ash:#5A5F6E;--magenta:#D6006B;--navy:#17265E;--line:rgba(23,38,94,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:'Schibsted Grotesk',system-ui,sans-serif;padding:44px 28px 90px}
::selection{background:var(--magenta);color:var(--paper)}
.head{max-width:1400px;margin:0 auto 40px}
h1{font-size:clamp(1.9rem,3.6vw,2.9rem);font-weight:800;letter-spacing:-.032em;line-height:1}
.sub{margin-top:12px;max-width:70ch;color:#31363F;font-size:1rem;line-height:1.5}
.grid{max-width:1400px;margin:0 auto;display:grid;gap:44px}
figure{border:1px solid var(--line);background:#fff}
figure img{display:block;width:100%;height:auto}
figcaption{padding:16px 18px 20px;border-top:1px solid var(--line);background:var(--paper)}
.t{font-size:1.15rem;font-weight:700;letter-spacing:-.015em}
.t em{font-style:normal;font-family:'DM Mono',monospace;font-size:.66rem;letter-spacing:.13em;
  color:var(--navy);border:1px solid var(--line);padding:3px 7px;margin-left:10px;vertical-align:2px}
.d{margin-top:8px;color:#31363F;font-size:.94rem;line-height:1.5;max-width:78ch}
.w{margin-top:10px;color:#8A3B00;font-size:.87rem;line-height:1.45;max-width:78ch}
.live{margin-top:12px;font-family:'DM Mono',monospace;font-size:.78rem}
.live a{color:var(--magenta)}
</style></head><body>
<div class="head">
<h1>Round 8 — four worlds, rendered.</h1>
<p class="sub">Comps only: composition, palette and material. <strong>Every body paragraph in these
images was written by the image model and is not DCS copy</strong> — ignore the prose. Two figures
are fabricated and flagged below. Shortlist two and I'll build them as animated pages.</p>
</div>
<div class="grid">
<figure><img src="r8-comps/assigned-survey-sheet.jpg" alt="Survey Sheet comp">
<figcaption><div class="t">The Survey Sheet <em>THE ROLL</em></div>
<div class="d">An Ordnance Survey sheet that happens to be a website. The contour field, the KEY panel
carrying the services, the cartographic scale bar. Magenta is spent once, on the action.</div>
<div class="w">Render defect: the second headline line is garbled where it collides with the grey line.</div>
<div class="live">CODED &amp; ANIMATED → <a href="r8-a-survey-sheet.html">r8-a-survey-sheet.html</a></div>
</figcaption></figure>

<figure><img src="r8-comps/pick-jobbing-printer.jpg" alt="Jobbing Printer comp">
<figcaption><div class="t">The Jobbing Printer <em>IMPECCABLE'S PICK</em></div>
<div class="d">The letterpress shop that set your cards and invoices before the web — the same
mechanism one trade earlier. Second-colour magenta run slightly out of register, quoins, crop marks,
real ink impression.</div>
<div class="w">Fabricated: "EST. 1919 TRADE, 2019 ONLINE" — 1919 is invented, my prompt's error. Also
a static medium: its motion has to be invented against the grain.</div>
</figcaption></figure>

<figure><img src="r8-comps/alt-departure-board.jpg" alt="Departure Board comp">
<figcaption><div class="t">The Departure Board <em>ALTERNATE</em></div>
<div class="d">Services as split-flap rows, tiles caught mid-flip, one row lit amber. The most
arresting motion on the table and cheap to build in CSS.</div>
<div class="w">Fabricated: the "3 WEEKS" / "5 WEEKS" lead times are invented — no such figure exists.
The world also implies live data DCS doesn't have.</div>
</figcaption></figure>

<figure><img src="r8-comps/alt-custody-line.jpg" alt="Custody Line comp">
<figcaption><div class="t">The Custody Line <em>ALTERNATE</em></div>
<div class="d">One unbroken line carrying the whole promise: one conversation, I write the content,
I design and build it, it goes live, I look after it — that last segment dropping to a hairline and
running off the page, because the relationship doesn't end.</div>
<div class="w">Bottom-left is dead space, and the metaphor needs a beat of explaining.</div>
</figcaption></figure>
</div></body></html>
