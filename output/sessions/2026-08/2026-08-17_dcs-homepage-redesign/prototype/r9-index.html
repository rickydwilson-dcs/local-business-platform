<style>

<div class="head">
<h1>Round 9 — bolder hand.</h1>
<p class="sub">Every earlier direction is eliminated. No cream, no ochre, no hairlines, no architect.
<b>Ignore all body prose in these images</b> — the image model wrote it and it's the agency-speak your
brief bans. Judge the world, the colour and the energy. Pick one and I'll build it moving.</p>
</div>
<div class="grid">
<figure><img src="r8-comps/r9-op-art.jpg" alt="Op-art comp">
<figcaption><div class="t">Optical <em>LEADS THE HAND</em></div>
<div class="d">Bridget Riley by way of a design studio. Pure black on pure white, not one grey pixel,
one electric magenta spent only on the action. The wave bends and parts around the headline as if the
type displaced it. It is standing still and it is obviously moving — which is the entire brief.</div>
<div class="w">Real risk: at full page scale an op-art field can be genuinely uncomfortable, so amplitude
stays low behind content and reduced-motion kills it outright.</div>
</figcaption></figure>

<figure><img src="r8-comps/r9-collider.jpg" alt="Collider comp">
<figcaption><div class="t">Event Display <em>ALTERNATE</em></div>
<div class="d">A collider event, frozen the half-second after impact. Cyan and yellow tracks curling out
of the centre, magenta punching straight through, a radial calorimeter of energy bars. Service names
pinned to individual tracks on leader lines. This is the one that makes a tradesperson say "wow".</div>
<div class="w">Least honest mapping: tracks and energy don't actually mean anything about your services.
It's spectacle first, and it has to earn its meaning or it's decoration.</div>
</figcaption></figure>

<figure><img src="r8-comps/r9-cape.jpg" alt="Cape comp">
<figcaption><div class="t">Drawcord <em>ALTERNATE</em></div>
<div class="d">A fashion house, not a practice. Black silk, and one magenta cord that threads the garment,
runs out across the page picking up your four process steps, and terminates as the button itself — the
cord literally becomes the control. One pull turns a flat plane into a finished volume, which is
exactly what you sell.</div>
<div class="w">Risk: black-and-luxury can read expensive, and DCS competes on being affordable.</div>
</figcaption></figure>
</div></body></html>
