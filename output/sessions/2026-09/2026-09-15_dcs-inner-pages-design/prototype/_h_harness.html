<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Agent H harness</title>
<!-- Agent H verification harness. Exact-pixel iframe so the window is not
     resized out from under the other two wave-2 agents' tabs.
     ?src=legal.html&w=1440&h=900  -->
<style>
  html,body{margin:0;background:#3a3a44}
  iframe{border:0;display:block;background:#fff}
</style>
</head>
<body>
<iframe id="f"></iframe>
<script>
var q = new URLSearchParams(location.search);
var f = document.getElementById('f');
f.width  = q.get('w') || 1440;
f.height = q.get('h') || 900;
f.src    = q.get('src') || 'legal.html';
window.F = function(){ return f.contentWindow; };
window.D = function(){ return f.contentDocument; };
</script>
</body>
</html>
