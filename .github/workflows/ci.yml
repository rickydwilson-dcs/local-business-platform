name: CI

on:
  pull_request:
    branches: [staging, main]
    paths-ignore:
      - 'output/**'
      - 'docs/**'
      - '**/*.md'
  push:
    branches: [develop, staging, main]
    paths-ignore:
      - 'output/**'
      - 'docs/**'
      - '**/*.md'
  # Manual fallback for when push/pull_request webhooks are delayed or dropped
  # (e.g. a GitHub Actions incident) — run from the Actions tab or `gh workflow run CI`.
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    name: Quality Checks

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Run TypeScript check
        run: pnpm run type-check

      - name: Run Content Validation
        # F10: validate content for EVERY site, not just one. `-r` runs the script
        # only in sites that define it and fails the job if any site's content is
        # invalid — previously only colossus-scaffolding was checked, so other
        # sites' invalid MDX passed CI silently.
        run: pnpm -r --filter './sites/*' run validate:content

      - name: Run Tests
        run: pnpm test

      - name: Deployment safety checks (.vercelignore vs git-tracked files)
        # `tools/` is not a pnpm workspace member, so `pnpm test` (turbo run test)
        # never reaches tools/__tests__/ — this step is the only thing that runs
        # it. Scoped to the single file on purpose: the shared config's include
        # glob also covers 13 other long-dormant tools tests, and resurrecting
        # those is a separate decision, not a side effect of this guard.
        run: npx vitest run --config tools/__tests__/vitest.config.ts tools/__tests__/vercel-ignore-tracked-files.test.ts

      - name: Watchdog fault-injection harness
        # Proves the regression watchdog's gate turns a check red for each
        # deploy failure class (missing/empty/fabricated results, zero tests,
        # real failures). If the gate ever silently passes a bad run, this fails.
        run: npx tsx tools/watchdog/fault-injection.ts

      - name: Cache build
        uses: actions/cache@v3
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.mdx') }}
