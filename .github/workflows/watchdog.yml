name: Regression Watchdog

on:
  push:
    branches: [staging, main]
    paths-ignore:
      - "output/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      env:
        description: "Target environment"
        required: false
        default: "prod"
        type: choice
        options: [prod, staging]
      validate_loop:
        description: "Run end-to-end validation (deliberately broken test)"
        required: false
        default: "false"
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  watchdog:
    name: Cross-Site Smoke + Auto-Triage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history for git log in triage context
          fetch-depth: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: packages/playwright-shared

      - name: Resolve target environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "target=${{ inputs.env }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "target=prod" >> $GITHUB_OUTPUT
          else
            echo "target=staging" >> $GITHUB_OUTPUT
          fi

      # End-to-end validation mode: deliberately break a test to prove the triage loop works
      - name: Inject deliberate failure (validate-loop mode)
        if: inputs.validate_loop == 'true'
        run: npx tsx tools/watchdog/validate-loop.ts --inject
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Run cross-site smoke tests
        id: smoke
        run: |
          WATCHDOG_ENV=${{ steps.env.outputs.target }} \
          npx playwright test \
            --config packages/playwright-shared/smoke.config.ts \
            --reporter=json,github \
          2>&1 | tee /tmp/smoke-output.txt || echo "smoke_failed=true" >> $GITHUB_ENV
        env:
          CI: "true"

      - name: Move Playwright JSON results
        if: always()
        run: |
          # Playwright writes JSON to smoke-results.json in the working directory
          # (defined in smoke.config.ts reporter config); copy to a known path
          cp packages/playwright-shared/smoke-results.json /tmp/smoke-results.json 2>/dev/null || \
          echo '{"stats":{"ok":true},"suites":[]}' > /tmp/smoke-results.json

      - name: Run auto-triage (on failure)
        if: env.smoke_failed == 'true'
        run: npx tsx tools/watchdog/index.ts --results=/tmp/smoke-results.json --env=${{ steps.env.outputs.target }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_HOST: "https://cloud.langfuse.com"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      # Cleanup validate-loop injected failure after triage has run
      - name: Restore deliberate failure (validate-loop mode)
        if: inputs.validate_loop == 'true' && always()
        run: npx tsx tools/watchdog/validate-loop.ts --restore
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Upload smoke test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watchdog-smoke-results-${{ github.ref_name }}
          path: |
            packages/playwright-shared/smoke-results.json
            packages/playwright-shared/playwright-report/
            /tmp/smoke-output.txt
          retention-days: 30
