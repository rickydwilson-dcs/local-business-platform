name: Regression Watchdog

on:
  push:
    branches: [staging, main]
    paths-ignore:
      - "output/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      env:
        description: "Target environment"
        required: false
        default: "prod"
        type: choice
        options: [prod, staging]
      validate_loop:
        description: "Run end-to-end validation (deliberately broken test)"
        required: false
        default: "false"
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  watchdog:
    name: Cross-Site Smoke + Auto-Triage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      # F11: single source of truth for the results paths so the smoke reporter,
      # the copy step, the triage input, the gate input, and the artifact upload
      # can no longer drift out of sync. SMOKE_RESULTS_SRC must match the
      # outputFile in packages/playwright-shared/smoke.config.ts.
      SMOKE_RESULTS_SRC: packages/playwright-shared/smoke-results.json
      SMOKE_RESULTS: /tmp/smoke-results.json

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history for git log in triage context
          fetch-depth: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: packages/playwright-shared

      - name: Resolve target environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "target=${{ inputs.env }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "target=prod" >> $GITHUB_OUTPUT
          else
            echo "target=staging" >> $GITHUB_OUTPUT
          fi

      # End-to-end validation mode: deliberately break a test to prove the triage loop works
      - name: Inject deliberate failure (validate-loop mode)
        if: inputs.validate_loop == 'true'
        run: npx tsx tools/watchdog/validate-loop.ts --inject
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Run cross-site smoke tests
        id: smoke
        run: |
          set -o pipefail
          # Capture the real smoke exit code (pipefail => Playwright's code, not tee's).
          # We intentionally do NOT fail the step here: triage must still run on
          # failure, and the "Evaluate watchdog result" gate below is the single
          # authoritative pass/fail for the check. The captured code is handed to
          # that gate so a crashed run can never be laundered into a green check.
          WATCHDOG_ENV=${{ steps.env.outputs.target }} \
          npx playwright test \
            --config packages/playwright-shared/smoke.config.ts \
            --reporter=json,github \
          2>&1 | tee /tmp/smoke-output.txt && code=0 || code=$?
          echo "smoke_exit=$code" >> "$GITHUB_ENV"
          if [ "$code" -ne 0 ]; then echo "smoke_failed=true" >> "$GITHUB_ENV"; fi
          exit 0
        env:
          CI: "true"
          # --reporter=json,github above overrides smoke.config.ts's reporter array (including
          # its outputFile), so the json reporter falls back to stdout unless told otherwise here.
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ env.SMOKE_RESULTS_SRC }}

      - name: Move Playwright JSON results
        if: always()
        run: |
          # Playwright writes JSON to smoke-results.json in the working directory
          # (defined in smoke.config.ts reporter config); copy to a known path.
          # If it is missing we do NOT fabricate a passing report — we leave the
          # path absent so the gate below fails with MISSING_RESULTS. A run that
          # produced no results is a failure, not an all-clear.
          if ! cp "$SMOKE_RESULTS_SRC" "$SMOKE_RESULTS" 2>/dev/null; then
            echo "[watchdog] $SMOKE_RESULTS_SRC is missing — leaving $SMOKE_RESULTS absent so the gate fails."
            rm -f "$SMOKE_RESULTS"
          fi

      - name: Run auto-triage (on failure)
        if: env.smoke_failed == 'true'
        run: npx tsx tools/watchdog/index.ts --results=${{ env.SMOKE_RESULTS }} --env=${{ steps.env.outputs.target }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_HOST: "https://cloud.langfuse.com"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      # Cleanup validate-loop injected failure after triage has run
      - name: Restore deliberate failure (validate-loop mode)
        if: inputs.validate_loop == 'true' && always()
        run: npx tsx tools/watchdog/validate-loop.ts --restore
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Upload smoke test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watchdog-smoke-results-${{ github.ref_name }}
          path: |
            ${{ env.SMOKE_RESULTS_SRC }}
            packages/playwright-shared/playwright-report/
            /tmp/smoke-output.txt
          retention-days: 30

      # Authoritative pass/fail for the check. Runs last and always: the triage
      # engine only observes (opens issues); this gate is the only step that can
      # turn the Regression Watchdog red. It fails on real test failures, a
      # non-zero smoke exit, and — critically — a missing/empty/fabricated
      # results file, so a broken run can no longer masquerade as "all clear".
      - name: Evaluate watchdog result
        if: always()
        run: |
          npx tsx tools/watchdog/gate.ts \
            --results=${{ env.SMOKE_RESULTS }} \
            --smoke-exit="${{ env.smoke_exit }}"
