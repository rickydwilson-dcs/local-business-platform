name: Generate Visual Baselines

on:
  workflow_dispatch:
    inputs:
      site:
        description: "Site to generate baselines for"
        default: "colossus-scaffolding"
        type: choice
        options:
          - colossus-scaffolding

jobs:
  generate-baselines:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm --filter ${{ inputs.site }} run build
        env:
          NEXT_PUBLIC_R2_PUBLIC_URL: ${{ secrets.NEXT_PUBLIC_R2_PUBLIC_URL }}

      - name: Install Playwright browsers
        run: pnpm --filter ${{ inputs.site }} exec playwright install chromium --with-deps

      - name: Generate baselines
        run: pnpm --filter ${{ inputs.site }} run test:e2e:visual:update
        env:
          CI: true

      - name: Commit baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sites/${{ inputs.site }}/e2e/visual-regression.spec.ts-snapshots/
          git diff --cached --quiet || git commit -m "feat(visual): seed Playwright baselines for ${{ inputs.site }}

          Generated by generate-visual-baselines workflow on ubuntu-latest (chromium).
          Re-run this workflow after any intentional visual change to update baselines.

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          git push origin ${{ github.ref_name }}
